services:
  - type: web
    name: backendpath-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: backendpath-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: backendpath-db
    plan: free
